{% extends "chat/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="content-section">
    <form method="POST">
        {% csrf_token %}
        <fieldset class="form-group">
            <legend class="border-bottom mb-4">加入私密聊天室: {{ room.name }}</legend>
            <div class="form-group">
                <label for="password">请输入4位数密码:</label>
                <input type="password" class="form-control" name="password" maxlength="4" required>
            </div>
        </fieldset>
        <div class="form-group">
            <button class="btn btn-outline-info" type="submit">加入</button>
        </div>
    </form>
</div>
{% endblock content %}
