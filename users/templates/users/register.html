{% extends "chat/base.html" %} {% load crispy_forms_tags %} {% block content %}
<div class="content-section">
  <form method="POST">
    {% csrf_token %}
    <fieldset class="form-group">
      <legend class="border-bottom mb-4">立即注册</legend>
      {{ form|crispy }}
    </fieldset>
    <div class="form-group">
      <button class="btn btn-outline-info" type="submit">注册</button>
      <small class="text-muted ml-2">
        <a href="{% url 'login' %}">已有账号?点击登录</a>
      </small>
    </div>
  </form>
  <div class="border-top pt-3">
    <small class="text-muted">
      已有账号?
      <a class="ml-2" href="{% url 'login' %}">登录</a>
    </small>
  </div>
</div>
{% endblock content %}
