# The local edge (docs/09 and docs/10, D-147): Nginx with the production site configuration, serving the production build at
# https://chat.localhost:8443 and passing /api and /ws to a TEST-environment API on the host (port 3104, started by
# `scripts/e2e-stack.ts`). Bound to 127.0.0.1 only. Started and stopped with `bun run edge:up` / `bun run edge:down`, which
# also make the certificate and the web root this file mounts; the project name is fixed so `down` removes only this.
name: chatapp-edge

services:
  nginx:
    # The 1.30 series (D-169): exact tag and index digest (amd64 and arm64 among them). Upstream stopped security support for
    # 1.28 on 2026-04-14; the owner chose 1.30 on 2026-10-04. The server itself is moved at M8, not before.
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    ports:
      - "127.0.0.1:8443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/chatapp.conf:/etc/nginx/conf.d/chatapp.conf:ro
      - ./nginx/empty.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/chatapp/security-headers.conf:ro
      - ./nginx/transport-security.conf:/etc/nginx/chatapp/transport-security.conf:ro
      - ./nginx/proxy-api.conf:/etc/nginx/chatapp/proxy-api.conf:ro
      - ./nginx/env/local-http.conf:/etc/nginx/chatapp/env-http.conf:ro
      - ./nginx/env/local-server.conf:/etc/nginx/chatapp/env-server.conf:ro
      - ../.test-runs/edge/certs/chat.localhost.crt:/etc/nginx/chatapp/certs/chat.localhost.crt:ro
      - ../.test-runs/edge/certs/chat.localhost.key:/etc/nginx/chatapp/certs/chat.localhost.key:ro
      - ../.test-runs/edge/webroot/current:/opt/chatapp/web/current:ro
      - ../.test-runs/edge/webroot/assets:/opt/chatapp/web/assets:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/index.html || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
