# ChatApp site (docs/10 section 5; D-045, D-072, D-077). One file for the local edge (M2b), the rehearsal (M7) and
# production; only the two env includes differ (upstream address; server_name + certificates).
#
# The edge runs it on nginx 1.30 (D-169). It is also written to load, and to stay safe, on the 1.28 that the shared server
# runs until it is moved at M8: no add_header inheritance options, no regex `map` (CVE-2026-42533 is unfixed on 1.28.x), no
# `charset` filter (CVE-2026-48142/42934 likewise). Every location that
# answers over HTTPS includes transport-security.conf explicitly (SEC-22); static locations also include
# security-headers.conf (the page policy, byte-identical to apps/web/tools/csp.ts); /api and /ws do not, the app sets
# its own (D-045: no duplicates).

include /etc/nginx/chatapp/env-http.conf;   # upstream chatapp_api { server …; }

# Access log (D-077): request id, method, status, time, client address and a constant route class, nothing else —
# no path, query, Referer, User-Agent, Cookie or Location. One format per route class instead of a `map` over $uri.
# The last field is the application's own request id (a response header of the API), which ties a line to the
# application's log; it is empty for what Nginx answers itself.
log_format chatapp_static     '$time_iso8601 $request_id $request_method $status $request_time $remote_addr static $upstream_http_x_request_id';
log_format chatapp_asset      '$time_iso8601 $request_id $request_method $status $request_time $remote_addr asset $upstream_http_x_request_id';
log_format chatapp_api        '$time_iso8601 $request_id $request_method $status $request_time $remote_addr api $upstream_http_x_request_id';
log_format chatapp_auth       '$time_iso8601 $request_id $request_method $status $request_time $remote_addr auth $upstream_http_x_request_id';
log_format chatapp_upload     '$time_iso8601 $request_id $request_method $status $request_time $remote_addr upload $upstream_http_x_request_id';
log_format chatapp_attachment '$time_iso8601 $request_id $request_method $status $request_time $remote_addr attachment $upstream_http_x_request_id';
log_format chatapp_monitoring '$time_iso8601 $request_id $request_method $status $request_time $remote_addr monitoring $upstream_http_x_request_id';
log_format chatapp_ws         '$time_iso8601 $request_id $request_method $status $request_time $remote_addr ws $upstream_http_x_request_id';
log_format chatapp_redirect   '$time_iso8601 $request_id $request_method $status $request_time $remote_addr redirect $upstream_http_x_request_id';

# Second line of defence behind the application's own limits (docs/10: /api/auth/ and /api/invites/check).
limit_req_zone $binary_remote_addr zone=chatapp_auth:10m rate=60r/m;
limit_req_status 429;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    include /etc/nginx/chatapp/env-server.conf;   # server_name, ssl_certificate, ssl_certificate_key

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:chatapp_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;

    # What Nginx answers before it has chosen a location (a request line it cannot parse) has no location to take the header
    # from, so it is also set here. A location that adds headers of its own does not inherit these: nothing gets it twice.
    include /etc/nginx/chatapp/transport-security.conf;

    root /opt/chatapp/web/current;

    access_log /var/log/nginx/chatapp-access.log chatapp_static;
    error_log /dev/null;   # raw error lines can carry the request line (D-077)

    # Request budget (docs/10): small bodies by default; the single upload location raises it.
    client_max_body_size 128k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The document. no-cache: a new deploy is picked up on the next load.
    location = /index.html {
        include /etc/nginx/chatapp/transport-security.conf;
        include /etc/nginx/chatapp/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Hashed assets: immutable for a year; a missing asset is a real 404, never index.html.
    # Production serves them from a shared, append-only directory (docs/10: keep ≥ 7 days and ≥ 3 releases).
    location /assets/ {
        alias /opt/chatapp/web/assets/;
        access_log /var/log/nginx/chatapp-access.log chatapp_asset;
        include /etc/nginx/chatapp/transport-security.conf;
        include /etc/nginx/chatapp/security-headers.conf;
        # No `always`: a 404 for a missing asset must not be cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else is the SPA: a file if it exists (favicon, theme-init.js, licences), otherwise index.html.
    location / {
        include /etc/nginx/chatapp/transport-security.conf;
        include /etc/nginx/chatapp/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    location /api/ {
        access_log /var/log/nginx/chatapp-access.log chatapp_api;
        include /etc/nginx/chatapp/transport-security.conf;
        include /etc/nginx/chatapp/proxy-api.conf;
        proxy_pass http://chatapp_api;
    }

    location /api/auth/ {
        access_log /var/log/nginx/chatapp-access.log chatapp_auth;
        limit_req zone=chatapp_auth burst=60 nodelay;
        include /etc/nginx/chatapp/transport-security.conf;
        include /etc/nginx/chatapp/proxy-api.conf;
        proxy_pass http://chatapp_api;
    }

    location = /api/invites/check {
        access_log /var/log/nginx/chatapp-access.log chatapp_auth;
        limit_req zone=chatapp_auth burst=60 nodelay;
        include /etc/nginx/chatapp/transport-security.conf;
        include /etc/nginx/chatapp/proxy-api.conf;
        proxy_pass http://chatapp_api;
    }

    # The only place with a large body: PUT /api/uploads/<uuid>/content (M3), streamed straight through.
    location ~ "^/api/uploads/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/content$" {
        access_log /var/log/nginx/chatapp-access.log chatapp_upload;
        client_max_body_size 100m;
        client_body_timeout 15s;
        proxy_request_buffering off;
        include /etc/nginx/chatapp/transport-security.conf;
        include /etc/nginx/chatapp/proxy-api.conf;
        proxy_pass http://chatapp_api;
    }

    # Downloads and video seeking stream through without temp files.
    location /api/attachments/ {
        access_log /var/log/nginx/chatapp-access.log chatapp_attachment;
        proxy_buffering off;
        include /etc/nginx/chatapp/transport-security.conf;
        include /etc/nginx/chatapp/proxy-api.conf;
        proxy_pass http://chatapp_api;
    }

    location = /api/monitoring {
        access_log /var/log/nginx/chatapp-access.log chatapp_monitoring;
        client_max_body_size 256k;
        include /etc/nginx/chatapp/transport-security.conf;
        include /etc/nginx/chatapp/proxy-api.conf;
        proxy_pass http://chatapp_api;
    }

    location = /ws {
        access_log /var/log/nginx/chatapp-access.log chatapp_ws;
        include /etc/nginx/chatapp/transport-security.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_pass http://chatapp_api;
    }
}

# Plain HTTP: ACME challenges (production certbot) and a redirect. No default_server (shared host, docs/10).
server {
    listen 80;
    listen [::]:80;
    include /etc/nginx/chatapp/env-server.conf;
    server_tokens off;
    access_log /var/log/nginx/chatapp-access.log chatapp_redirect;
    error_log /dev/null;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
