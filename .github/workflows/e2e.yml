name: e2e

# Browser tests (docs/08 sections 2 and 5): the app built and served with the production Content Security Policy, the API and
# worker in the test environment, real Postgres/Valkey/Garage/Mailpit. Chromium and WebKit run everything, Firefox the
# smoke tests. The visual job compares Storybook screenshots inside the official Playwright image.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    # The complete browser suite takes about 47 minutes on the shared runner. Component and decoder suites have their
    # own jobs so their setup and runtime cannot exhaust this job's budget. Individual test/performance limits are unchanged.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - name: Create the local environment (secrets are generated, never printed)
        run: bun run setup
      - name: Start Postgres, Valkey, Garage and Mailpit
        run: bun run infra:up
      - run: bun run infra:bootstrap
      - name: Install the browsers and their system libraries
        run: node_modules/.bin/playwright install --with-deps chromium webkit firefox
        working-directory: apps/web
      - name: End-to-end tests
        run: bun run test:e2e
        env:
          CI: "true"
      - name: Report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
      - name: Service logs
        if: failure()
        run: docker compose -f infra/compose.dev.yml --env-file .env.local logs --no-color --tail=200
      - name: Stop services
        if: always()
        run: bun run infra:down

  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - name: Generate localized messages for the standalone review harness
        run: bun run --cwd apps/web generate
      - name: Install the browsers and their system libraries
        run: node_modules/.bin/playwright install --with-deps chromium webkit
        working-directory: apps/web
      - name: Review regression scenarios with real components
        run: bun run test:review
      - name: Report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: review-report
          path: test-results/review-components
          retention-days: 7

  media-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - name: Install the browsers and their system libraries
        run: node_modules/.bin/playwright install --with-deps chromium webkit
        working-directory: apps/web
      # The script creates and closes its own verified API, worker, storage and isolated decoder stack.
      - name: Rich messages with the real isolated decoder (M3 scenario 6)
        run: bun run test:m3:e2e
        env:
          CI: "true"
      - name: Failure traces (exclude generated accounts and instance secrets)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: media-browser-report
          path: .test-runs/e2e-media/results
          include-hidden-files: true
          retention-days: 7

  # The gateway's configuration: the compose file is valid and Nginx loads the site in the pinned image. The suite that
  # runs against the live gateway is local only (docs/12 D-147): Docker on a hosted runner has another network topology.
  edge-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Compose file and nginx -t in the pinned image
        run: bun scripts/edge.ts configtest

  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - name: Screenshot comparison in the Playwright image
        run: bun run test:visual
      - name: Differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: .test-runs/visual/results
          retention-days: 7
