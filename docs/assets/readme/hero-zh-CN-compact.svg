  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
    <text x="160" y="58" font-size="13" font-weight="600" letter-spacing="2.5" fill="#bac7f3">与伙伴交流，与 AGENT 协作</text>
    <text x="156" y="132" font-size="64" font-weight="750" letter-spacing="-3" fill="#fff">ChatApp</text>
