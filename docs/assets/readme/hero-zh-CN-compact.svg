<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" role="img" aria-labelledby="title description">
  <title id="title">ChatApp</title>
  <desc id="description">ChatApp：聊天、分享文件，让 Agent 在你的掌控下协助行动。</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1533"/><stop offset="1" stop-color="#22234f"/></linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6db4ff"/><stop offset="1" stop-color="#6150df"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#6486ff" stop-opacity=".3"/><stop offset="1" stop-color="#6486ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge"><stop stop-color="#a9baff" stop-opacity=".3"/><stop offset="1" stop-color="#ffffff" stop-opacity=".06"/></linearGradient>
  </defs>
  <rect width="680" height="240" rx="28" fill="url(#surface)"/>
  <ellipse cx="560" cy="100" rx="370" ry="250" fill="url(#glow)"/>
  <path d="M0 240Q320 130 650 240T1280 200" fill="none" stroke="#a6b6ff" stroke-opacity=".08"/>
  <g transform="translate(36 64) scale(.75)">
