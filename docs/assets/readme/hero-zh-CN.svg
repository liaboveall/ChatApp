<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-labelledby="title description">
  <title id="title">ChatApp</title>
  <desc id="description">ChatApp：聊天、分享文件，让 Agent 在你的掌控下协助行动。</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1533"/><stop offset="1" stop-color="#22234f"/></linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6db4ff"/><stop offset="1" stop-color="#6150df"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#6486ff" stop-opacity=".3"/><stop offset="1" stop-color="#6486ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge"><stop stop-color="#a9baff" stop-opacity=".3"/><stop offset="1" stop-color="#ffffff" stop-opacity=".06"/></linearGradient>
  </defs>
  <rect width="1280" height="280" rx="28" fill="url(#surface)"/>
  <ellipse cx="1040" cy="100" rx="370" ry="250" fill="url(#glow)"/>
  <path d="M0 240Q320 130 650 240T1280 200" fill="none" stroke="#a6b6ff" stroke-opacity=".08"/>
  <g transform="translate(64 84) scale(.875)">
    <rect width="128" height="128" rx="30" fill="url(#icon)"/>
    <path d="M44 30h40a24 24 0 0 1 24 24v12a24 24 0 0 1-24 24H70L50 108V90H44a24 24 0 0 1-24-24V54a24 24 0 0 1 24-24Z" fill="#fff"/>
    <path d="M0-1c.07.56.44.93 1 1-.56.07-.93.44-1 1-.07-.56-.44-.93-1-1 .56-.07.93-.44 1-1Z" transform="translate(64 60) scale(20)" fill="url(#icon)"/>
  </g>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
    <text x="208" y="74" font-size="13" font-weight="600" letter-spacing="2.5" fill="#bac7f3">与伙伴交流，与 AGENT 协作</text>
    <text x="204" y="150" font-size="72" font-weight="750" letter-spacing="-3" fill="#fff">ChatApp</text>
    <text x="208" y="195" font-size="24" fill="#d5dcf3">让聊天有上下文，让协作有下一步。</text>
    <g transform="translate(930 46)">
      <rect width="280" height="188" rx="20" fill="#fff" fill-opacity=".04" stroke="url(#edge)"/>
      <text x="24" y="34" font-size="12" font-weight="600" letter-spacing="2" fill="#aebeea">BUILT-IN AGENT</text>
      <g font-size="17" fill="#edf1ff">
        <circle cx="30" cy="64" r="4" fill="#91c0ff"/><text x="48" y="70">总结讨论</text>
        <path d="M30 77v18" stroke="#677ba8"/>
        <circle cx="30" cy="108" r="4" fill="#b5a4ff"/><text x="48" y="114">起草回复</text>
        <path d="M30 121v18" stroke="#677ba8"/>
        <circle cx="30" cy="152" r="4" fill="#85d7bc"/><text x="48" y="158">审批后执行</text>
      </g>
    </g>
  </g>
</svg>
